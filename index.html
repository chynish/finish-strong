<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finish Strong">
<title>Finish Strong Challenge</title>
<meta name="theme-color" content="#6b1f2a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#f6efe0;--card:#fffaf0;--text:#1b2236;--maroon:#6b1f2a;--gold:#d4a017;--sage:#8a9a78;--sageTint:#e4ead9;--border:#e3d7bd;--muted:#7a735f;--onmaroon:#fff6e4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2b;--card:#1d2540;--text:#f3ead8;--maroon:#7d2634;--gold:#e0b13a;--sage:#a3b38e;--sageTint:#2a3a35;--border:#33406a;--muted:#a9a58f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a2b;--card:#1d2540;--text:#f3ead8;--maroon:#7d2634;--gold:#e0b13a;--sage:#a3b38e;--sageTint:#2a3a35;--border:#33406a;--muted:#a9a58f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:14px 16px 30px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.container{width:100%;max-width:600px}
.banner{background:#f6efe0;border-radius:18px;overflow:hidden;border:1px solid var(--border);margin-bottom:6px}
.banner img{display:block;width:100%;height:auto}
.dates{text-align:center;color:var(--muted);font-size:14px;margin:10px 0 14px;font-style:italic}
.goals{background:var(--card);border:2px solid var(--text);border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:14px;line-height:1.7}
.goals b{color:var(--maroon)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .goals b{color:var(--gold)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center;font-size:13px}
.stat strong{display:block;font-size:20px;color:var(--maroon);margin:2px 0 6px;font-family:"Snell Roundhand","Apple Chancery","Brush Script MT",cursive}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stat strong{color:var(--gold)}}
.bar{height:6px;background:var(--border);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:4px;transition:width .3s}
.week{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:20px;overflow:hidden}
.wh{background:var(--maroon);color:var(--onmaroon);padding:10px 16px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:4px solid var(--gold)}
.wh span:first-child{font-size:24px;font-family:"Snell Roundhand","Apple Chancery","Brush Script MT",cursive;font-weight:bold}
.wh small{font-size:12px;opacity:.9}
.body{padding:4px 16px 16px}
.day{display:flex;align-items:center;justify-content:space-between;padding:8px 6px;border-bottom:1px dashed var(--border);border-radius:8px}
.day.done{background:var(--sageTint)}
.dn{font-weight:600;font-size:14px;width:88px}
.grp{display:flex;gap:6px}
.cb{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;cursor:pointer;width:56px;text-align:center}
.cb input{width:22px;height:22px;accent-color:var(--maroon);margin:0 0 2px}
.cb em{font-style:normal;font-size:9px;font-weight:normal;color:var(--muted)}
.wk{margin-top:14px;padding:12px;border:2px dashed var(--sage);border-radius:12px}
.wk h4{margin:0 0 10px;font-size:20px;color:var(--maroon);font-family:"Snell Roundhand","Apple Chancery","Brush Script MT",cursive}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wk h4{color:var(--gold)}}
.wf{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.wg{display:flex;gap:14px;align-items:center}.wg .cb{width:auto}
.team{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:22px}
.team h3{margin:0 0 2px;font-size:26px;color:var(--maroon);font-family:"Snell Roundhand","Apple Chancery","Brush Script MT",cursive}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .team h3{color:var(--gold)}}
.sync{font-size:11px;color:var(--muted);margin-bottom:10px}
.pp{padding:10px 0;border-top:1px dashed var(--border)}
.pp:first-of-type{border-top:0}
.pn{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px;margin-bottom:5px}
.pn small{font-weight:normal;color:var(--muted);font-size:11px}
.pl{font-size:12px;color:var(--muted);line-height:1.6;margin-top:5px}
.pl b{color:var(--text)}
.who{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.who button{flex:1;min-width:90px;background:var(--maroon);color:var(--onmaroon);border:0;border-bottom:3px solid var(--gold);border-radius:10px;padding:11px;font-size:15px;font-weight:600}
.swap{background:none;border:0;color:var(--muted);font-size:11px;text-decoration:underline;padding:6px 0 0}
.reset{display:block;margin:6px auto 0;background:none;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:8px 16px;font-size:12px}
</style>
</head>

    <div>🏃 <b>Every day:</b> 10,000 steps · 100 oz water · stretch 10 min</div>
    <div>📅 <b>Every week:</b> 3 runs · 1 letter to someone</div>
  </div>
  <div class="stats">
    <div class="stat">Steps<strong id="t-Steps"></strong><div class="bar"><i id="b-Steps"></i></div></div>
    <div class="stat">Water<strong id="t-Water"></strong><div class="bar"><i id="b-Water"></i></div></div>
    <div class="stat">Stretching<strong id="t-Stretch"></strong><div class="bar"><i id="b-Stretch"></i></div></div>
    <div class="stat">Runs &amp; letters<strong id="t-wk"></strong><div class="bar"><i id="b-wk"></i></div></div>
  </div>
  <div class="team" id="team"></div>
  <div id="weeks"></div>
  <button class="reset" id="reset">Reset all progress</button>
</div>
<script>
const habits=[{n:'Steps',t:'10,000'},{n:'Water',t:'100 oz'},{n:'Stretch',t:'10 min'}];
const weeks=[
[1,"Nov 02 – Nov 08",["Mon 11/02","Tue 11/03","Wed 11/04","Thu 11/05","Fri 11/06","Sat 11/07","Sun 11/08"]],
[2,"Nov 09 – Nov 15",["Mon 11/09","Tue 11/10","Wed 11/11","Thu 11/12","Fri 11/13","Sat 11/14","Sun 11/15"]],
[3,"Nov 16 – Nov 22",["Mon 11/16","Tue 11/17","Wed 11/18","Thu 11/19","Fri 11/20","Sat 11/21","Sun 11/22"]],
[4,"Nov 23 – Nov 29",["Mon 11/23","Tue 11/24","Wed 11/25","Thu 11/26","Fri 11/27","Sat 11/28","Sun 11/29"]],
[5,"Nov 30 – Dec 06",["Mon 11/30","Tue 12/01","Wed 12/02","Thu 12/03","Fri 12/04","Sat 12/05","Sun 12/06"]],
[6,"Dec 07 – Dec 13",["Mon 12/07","Tue 12/08","Wed 12/09","Thu 12/10","Fri 12/11","Sat 12/12","Sun 12/13"]],
[7,"Dec 14 – Dec 20",["Mon 12/14","Tue 12/15","Wed 12/16","Thu 12/17","Fri 12/18","Sat 12/19","Sun 12/20"]],
[8,"Dec 21 – Dec 27",["Mon 12/21","Tue 12/22","Wed 12/23","Thu 12/24","Fri 12/25","Sat 12/26","Sun 12/27"]],
[9,"Dec 28 – Jan 01",["Mon 12/28","Tue 12/29","Wed 12/30","Thu 12/31","Fri 01/01"]]];
const KEY='finish-strong-v1';let s={};
try{s=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){s={};}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}scheduleSync();};
const cb=(k,l,sub)=>`<label class="cb"><input type="checkbox" data-k="${k}" ${s[k]?'checked':''}><span>${l}</span>${sub?`<em>${sub}</em>`:''}</label>`;
function dayDone(n,d){return habits.every(h=>s[`w${n}|${d}|${h.n}`]);}
function render(){
  document.getElementById('weeks').innerHTML=weeks.map(([n,r,days])=>`
  <div class="week"><div class="wh"><span>Week ${n}</span><small>${r}</small></div><div class="body">
  ${days.map(d=>`<div class="day ${dayDone(n,d)?'done':''}" data-d="${n}|${d}"><div class="dn">${d}</div><div class="grp">${habits.map(h=>cb(`w${n}|${d}|${h.n}`,h.n,h.t)).join('')}</div></div>`).join('')}
  <div class="wk"><h4>This week</h4><div class="wf">
   <div class="wg">${[1,2,3].map(i=>cb(`w${n}-run${i}`,'Run '+i)).join('')}</div>
   <div class="wg">${cb(`w${n}-letter`,'Letter')}</div></div></div></div></div>`).join('');
  stats();
}
const cnt=f=>Object.keys(s).filter(k=>s[k]&&f(k)).length;
function setStat(id,txt,v,max){document.getElementById('t-'+id).textContent=txt;document.getElementById('b-'+id).style.width=Math.round(v/max*100)+'%';}
function stats(){
  habits.forEach(h=>{const v=cnt(k=>k.endsWith('|'+h.n));setStat(h.n,v+' / 61',v,61);});
  const r=cnt(k=>/-run\d$/.test(k)),l=cnt(k=>/-letter$/.test(k));
  setStat('wk','R '+r+'/27 · L '+l+'/9',r+l,36);
  renderTeam();
}
document.getElementById('weeks').addEventListener('change',e=>{
  const k=e.target.dataset.k;if(!k)return;
  if(e.target.checked)s[k]=true;else delete s[k];
  save();
  const row=e.target.closest('.day');
  if(row){const[n,d]=row.dataset.d.split('|');row.classList.toggle('done',dayDone(n,d));}
  stats();
});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('Clear all checkmarks? This cannot be undone.')){s={};save();render();}});

/* ---------- Team sync (Firebase Realtime Database via REST) ---------- */
const DB='https://finish-strong-b5a07-default-rtdb.firebaseio.com/teams/BURN/users';
const NAMES=['Amanda','Caitlyn','Parker'];
let me=null;try{me=localStorage.getItem('fs-me');}catch(e){}
if(NAMES.indexOf(me)<0)me=null;
let team={},syncT=null,status='';
function toObj(v){if(!v||!v.k)return{};try{const o={};JSON.parse(v.k).forEach(k=>o[k]=true);return o;}catch(e){return{};}}
function tally(o){
  const c=f=>Object.keys(o).filter(k=>o[k]&&f(k)).length;
  return{Steps:c(k=>k.endsWith('|Steps')),Water:c(k=>k.endsWith('|Water')),Stretch:c(k=>k.endsWith('|Stretch')),run:c(k=>/-run\d$/.test(k)),letter:c(k=>/-letter$/.test(k))};
}
function curWeek(){const d=Math.floor((new Date()-new Date(2026,10,2))/864e5);return Math.min(9,Math.max(1,Math.floor(d/7)+1));}
function weekTally(o,n){
  const c=f=>Object.keys(o).filter(k=>o[k]&&k.indexOf('w'+n+'|')===0&&f(k)).length;
  return{Steps:c(k=>k.endsWith('|Steps')),Water:c(k=>k.endsWith('|Water')),Stretch:c(k=>k.endsWith('|Stretch')),
    run:Object.keys(o).filter(k=>o[k]&&k.indexOf('w'+n+'-run')===0).length,letter:o['w'+n+'-letter']?1:0};
}
function ago(t){if(!t)return 'no activity yet';const m=Math.round((Date.now()-t)/6e4);if(m<1)return 'updated just now';if(m<60)return 'updated '+m+'m ago';const h=Math.round(m/60);if(h<48)return 'updated '+h+'h ago';return 'updated '+Math.round(h/24)+'d ago';}
function renderTeam(){
  const el=document.getElementById('team');if(!el)return;
  if(!me){
    el.innerHTML='<h3>Team BURN</h3><div class="sync">Who are you? (You only pick this once.)</div><div class="who">'+NAMES.map(n=>`<button data-me="${n}">${n}</button>`).join('')+'</div>';
    return;
  }
  const wk=curWeek();
  el.innerHTML='<h3>Team BURN</h3><div class="sync">'+status+'</div>'+NAMES.map(n=>{
    const o=n===me?s:toObj(team[n]),t=tally(o),w=weekTally(o,wk);
    const pct=Math.round((t.Steps+t.Water+t.Stretch+t.run+t.letter)/219*100);
    const days=wk===9?5:7;
    return `<div class="pp"><div class="pn"><span>${n}${n===me?' (you)':''}</span><small>${n===me?'':ago(team[n]&&team[n].u)}</small></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="pl"><b>Overall ${pct}%</b> · Steps ${t.Steps} · Water ${t.Water} · Stretch ${t.Stretch} · Runs ${t.run} · Letters ${t.letter}<br>
    <b>Week ${wk}:</b> Steps ${w.Steps}/${days} · Water ${w.Water}/${days} · Stretch ${w.Stretch}/${days} · Runs ${w.run}/3 · Letter ${w.letter}/1</div></div>`;
  }).join('')+'<button class="swap" data-swap="1">Not you? Switch name</button>';
}
document.getElementById('team').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.me){me=b.dataset.me;try{localStorage.setItem('fs-me',me);}catch(x){}status='Connecting…';renderTeam();pull(true);}
  if(b.dataset.swap){me=null;try{localStorage.removeItem('fs-me');}catch(x){}renderTeam();}
});
function scheduleSync(){if(!me)return;clearTimeout(syncT);syncT=setTimeout(push,800);}
function push(){
  if(!me)return;
  return fetch(DB+'/'+me+'.json',{method:'PUT',body:JSON.stringify({k:JSON.stringify(Object.keys(s)),u:Date.now()})})
    .then(r=>{if(!r.ok)throw 0;status='Synced ✓';team[me]={k:JSON.stringify(Object.keys(s)),u:Date.now()};renderTeam();})
    .catch(()=>{status='Offline – will sync when you are back online';renderTeam();});
}
function pull(first){
  if(!me)return;
  return fetch(DB+'.json').then(r=>{if(!r.ok)throw 0;return r.json();}).then(d=>{
    team=d||{};
    if(first){
      if(Object.keys(s).length===0&&team[me]&&team[me].k){s=toObj(team[me]);try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}render();}
      else return push();
    }
    status='Synced ✓';renderTeam();
  }).catch(()=>{status='Offline – showing last known progress';renderTeam();});
}
function initTeam(){
  renderTeam();pull(true);
  setInterval(()=>{if(document.visibilityState==='visible')pull(false);},30000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull(false);});
  window.addEventListener('online',()=>{push().then(()=>pull(false));});
}
render();
initTeam();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
</html>
